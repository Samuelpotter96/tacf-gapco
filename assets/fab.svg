  <rect x="144" y="153" width="12" height="40" rx="2" fill="url(#escuro)" stroke="#55606B" stroke-width="0.9"/>
  <path d="M144,158 L156,153 M144,164 L156,159 M144,170 L156,165 M144,176 L156,171 M144,182 L156,177 M144,188 L156,183 M144,193 L156,189" stroke="#E4E8EC" stroke-width="1.6"/>
  <rect x="140" y="192" width="20" height="9" rx="3" fill="url(#prata)" stroke="#55606B" stroke-width="0.9"/>
