<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" role="img" aria-label="Gládio alado da Força Aérea Brasileira">
  <defs>
    <linearGradient id="prata" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.3" stop-color="#C3CAD2"/>
      <stop offset="0.55" stop-color="#F1F3F5"/><stop offset="0.8" stop-color="#8A949E"/>
      <stop offset="1" stop-color="#D3D8DD"/>
