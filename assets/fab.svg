  <use href="#asa"/>
  <use href="#asa" transform="translate(300,0) scale(-1,1)"/>
  <!-- Lâmina: metade clara / metade escura, ponta para cima -->
  <path d="M150,4 L150,136 L142,136 L142,22 Z" fill="url(#claro)" stroke="#55606B" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M150,4 L158,22 L158,136 L150,136 Z" fill="url(#escuro)" stroke="#55606B" stroke-width="0.9" stroke-linejoin="round"/>
