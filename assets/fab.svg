  <rect x="120" y="134" width="60" height="13" rx="3" fill="url(#prata)" stroke="#55606B" stroke-width="0.9"/>
  <rect x="138" y="128" width="24" height="25" rx="3" fill="url(#prata)" stroke="#55606B" stroke-width="0.9"/>
